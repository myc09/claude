<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#1e1e1e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CodePad">
  <title>CodePad</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Anmeldung -->
  <div id="login" class="login hidden">
    <form id="login-form" class="login-box">
      <img src="icons/icon.svg" alt="" width="64" height="64">
      <h1>CodePad</h1>
      <p>Python &amp; C – überall bearbeiten und ausführen</p>
      <input id="login-password" type="password" placeholder="Passwort" autocomplete="current-password" required>
      <button type="submit">Anmelden</button>
      <div id="login-error" class="login-error"></div>
    </form>
  </div>

  <!-- Editor -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <button id="btn-menu" class="icon-btn" title="Explorer (Strg+B)" aria-label="Explorer">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="title">
        <span id="title-file">CodePad</span>
        <span id="save-state" class="save-state"></span>
      </div>
      <button id="btn-search" class="icon-btn" title="Suchen (Strg+F)" aria-label="Suchen">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      </button>
      <button id="btn-stop" class="icon-btn danger hidden" title="Stoppen" aria-label="Stoppen">
        <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1" class="fill"/></svg>
      </button>
      <button id="btn-run" class="run-btn" title="Ausführen (Strg+Enter / F5)" aria-label="Ausführen">
        <svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z" class="fill"/></svg>
        <span>Ausführen</span>
      </button>
      <button id="btn-more" class="icon-btn" title="Mehr" aria-label="Mehr">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5" class="fill"/><circle cx="12" cy="12" r="1.5" class="fill"/><circle cx="12" cy="19" r="1.5" class="fill"/></svg>
      </button>
      <div id="more-menu" class="menu hidden">
        <button data-action="font-up">Schrift größer</button>
        <button data-action="font-down">Schrift kleiner</button>
        <button data-action="wrap">Zeilenumbruch an/aus</button>
        <button data-action="keys">Sonderzeichen-Leiste an/aus</button>
        <button data-action="download">Datei herunterladen</button>
        <button data-action="logout">Abmelden</button>
      </div>
    </header>

    <div class="main">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-head">
          <span>EXPLORER</span>
          <div class="sidebar-actions">
            <button id="btn-new-file" class="icon-btn small" title="Neue Datei" aria-label="Neue Datei">
              <svg viewBox="0 0 24 24"><path d="M14 3H6v18h12V7z M14 3v4h4 M12 11v6 M9 14h6"/></svg>
            </button>
            <button id="btn-new-folder" class="icon-btn small" title="Neuer Ordner" aria-label="Neuer Ordner">
              <svg viewBox="0 0 24 24"><path d="M3 6h6l2 2h10v11H3z M12 11v5 M9.5 13.5h5"/></svg>
            </button>
            <button id="btn-refresh" class="icon-btn small" title="Aktualisieren" aria-label="Aktualisieren">
              <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg>
            </button>
          </div>
        </div>
        <div id="tree" class="tree"></div>
      </aside>
      <div id="backdrop" class="backdrop hidden"></div>
      <div id="sidebar-resizer" class="resizer-v"></div>

      <section class="workbench">
        <nav id="tabs" class="tabs"></nav>
        <div id="editor-wrap" class="editor-wrap">
          <div id="editor" class="editor"></div>
          <div id="welcome" class="welcome">
            <h2>CodePad</h2>
            <p>Öffne eine Datei im Explorer oder lege eine neue an.</p>
            <p class="hint">Strg+Enter ausführen · Strg+S speichern · Strg+B Explorer · Strg+J Terminal</p>
          </div>
        </div>
        <div id="keys" class="keys"></div>
        <div id="panel-resizer" class="resizer-h"></div>
        <section id="panel" class="panel">
          <div class="panel-head">
            <span class="panel-title">TERMINAL</span>
            <span id="run-status" class="run-status"></span>
            <div class="panel-actions">
              <button id="btn-clear" class="icon-btn small" title="Leeren" aria-label="Leeren">
                <svg viewBox="0 0 24 24"><path d="M5 7h14M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
              </button>
              <button id="btn-panel" class="icon-btn small" title="Terminal ein-/ausklappen (Strg+J)" aria-label="Terminal ein-/ausklappen">
                <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
              </button>
            </div>
          </div>
          <pre id="output" class="output"></pre>
          <form id="stdin-form" class="stdin">
            <span class="prompt">›</span>
            <input id="stdin" type="text" placeholder="Eingabe für das Programm …" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="send">
            <button type="button" id="btn-eof" class="icon-btn small" title="Eingabe beenden (EOF / Strg+D)">EOF</button>
          </form>
        </section>
      </section>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="dist/app.js"></script>
</body>
</html>
